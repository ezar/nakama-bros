    <style>
      /* Boot card — see the #boot markup at the end of <body>.
         Inlined on purpose: this has to paint on the very first frame, before
         the stylesheet or the bundle has been fetched.

         The sky, the sun and the sea are the same values `SeaScene` uses, and
         the horizon sits at the same 64%, because the launch image, this card,
         the loading screen and the title are meant to be one continuous shot.
         They were not: this was a night sea and SeaScene is an evening one, so
         the card did not hand over to the game, it got replaced by it. If you
         change these, change scripts/icons.mjs and src/ui/art/SeaScene.tsx to
         match — all three paint the same view. */
      html, body { margin: 0; background: #050a14; }
      #boot {
        --mark: 96px;
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: linear-gradient(180deg,
          #05101f 0%, #0f2c51 18%, #2a5877 38%, #6c8b92 53%,
          #c69a66 60%, #f2c480 63.4%, #a9c0b3 64%);
        opacity: 1;
        transition: opacity 420ms ease-out;
      }
      #boot.boot--gone { opacity: 0; pointer-events: none; }
      /* the haze the low sun bleeds into everything around it */
      #boot-glow {
        position: absolute;
        left: 68%;
        top: 46%;
        width: 52vw;
        height: 52vw;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle,
          rgba(255, 222, 150, 0.55) 0%, rgba(246, 178, 74, 0.28) 26%, rgba(246, 178, 74, 0) 62%);
      }
      #boot-sun {
        position: absolute;
        left: 68%;
        top: 60.5%;
        width: 16vw;
        height: 16vw;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle at 42% 38%, #ffe9ae 0%, #f5b24a 58%, #e2853a 100%);
        box-shadow: 0 0 90px 30px rgba(246, 178, 74, 0.35);
      }
      #boot-sea {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 36%;
        background: linear-gradient(180deg, #a9c0b3 0%, #3e7b8d 26%, #0a2438 100%);
      }
      /* The logo lands where the title screen's does, so the handover is the
         waves starting to move and nothing else. */
      #boot-stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 18%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #boot-mark {
        width: var(--mark);
        height: var(--mark);
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.75));
      }
      #boot-title {
        position: relative;
        display: inline-block;
        margin: -6px 0 0;
        font-family: 'Rubik', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(2.6rem, 7.6vw, 6rem);
        font-weight: 800;
        line-height: 0.94;
        letter-spacing: -0.012em;
      }
      /* Back layer: ink contour plus an extrusion falling away from the light.
         A text-shadow cannot sit behind a background-clipped fill, so the two
         are separate boxes stacked in place — the same trick the logo uses. */
      #boot-title::before {
        content: 'NAKAMA BROS';
        position: absolute;
        left: 0;
        top: 0;
        color: #23130a;
        -webkit-text-stroke: 0.055em #23130a;
        text-shadow: 0 0.028em 0 #3b2410, 0 0.05em 0 #2a1808, 0 0.075em 0 #1b0f07,
                     0 0.1em 0 #140a04, 0 0.17em 0.22em rgba(0, 0, 0, 0.8);
      }
      #boot-title span {
        position: relative;
        background: linear-gradient(180deg, #fff3ce 0%, #f4c542 40%, #c8973f 56%, #8a5f1e 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot-keel {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: min(70vw, 420px);
        margin-top: 6px;
      }
      #boot-keel i { flex: 1; height: 1px; }
      #boot-keel i:first-of-type { background: linear-gradient(90deg, transparent, #c8973f); }
      #boot-keel i:last-of-type { background: linear-gradient(90deg, #c8973f, transparent); }
      #boot-keel svg { width: 22px; height: 8px; }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: none; }
      }
    </style>

  <body>
    <div id="root"></div>
    <!-- Boot card ------------------------------------------------------------
         Painted by the document itself, before a byte of the bundle runs, so
         the first frame is the game's own night sea rather than a white flash.
         main.tsx fades it out once React is on screen.

         On iOS the generated launch image covers the window before this one,
         and the loading screen opens behind it on the same sea, so all three
         are one view of the same evening and the handovers have nothing to
         notice. -->
    <div id="boot" role="status" aria-label="Cargando Nakama Bros">
      <div id="boot-glow"></div>
      <div id="boot-sun"></div>
      <div id="boot-sea"></div>
      <div id="boot-stack">
        <svg id="boot-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 14 C 44 14, 50 22, 50 30.5 C 50 36, 47.5 39.5, 44.5 41.5 C 43 42.5, 42.5 44, 42.5 46 C 42.5 50.5, 38.5 53, 32 53 C 25.5 53, 21.5 50.5, 21.5 46 C 21.5 44, 21 42.5, 19.5 41.5 C 16.5 39.5, 14 36, 14 30.5 C 14 22, 20 14, 32 14 Z"
                fill="#F7EDD3" stroke="#2A1D14" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M44.5 41.5 C 43 42.5, 42.5 44, 42.5 46 C 42.5 50.5, 38.5 53, 32 53 L 32 44 Z" fill="#2A1D14" opacity=".16"/>
          <ellipse cx="25" cy="31" rx="6.2" ry="6.8" fill="#2A1D14" transform="rotate(-9 25 31)"/>
          <ellipse cx="39" cy="31" rx="6.2" ry="6.8" fill="#2A1D14" transform="rotate(9 39 31)"/>
          <ellipse cx="26.6" cy="28.6" rx="1.7" ry="1.9" fill="#F7EDD3" opacity=".55"/>
          <path d="M32 36.5 L 35 42.5 L 29 42.5 Z" fill="#2A1D14"/>
          <g fill="#2A1D14">
            <rect x="26.5" y="46" width="1.5" height="6" rx=".6"/>
            <rect x="30.2" y="46" width="1.5" height="6" rx=".6"/>
            <rect x="33.9" y="46" width="1.5" height="6" rx=".6"/>
            <rect x="37.6" y="46" width="1.5" height="6" rx=".6"/>
            <rect x="23" y="45.4" width="18" height="1.5" rx=".7"/>
          </g>
          <g stroke="#2A1D14" stroke-width="1.6" stroke-linejoin="round">
            <path d="M8 20.5 C 14 13.5, 50 13.5, 56 20.5 C 50 25, 14 25, 8 20.5 Z" fill="#E3C169"/>
            <path d="M20 19 C 21 8.5, 43 8.5, 44 19 C 40 21.5, 24 21.5, 20 19 Z" fill="#E3C169"/>
            <path d="M20.3 17.6 C 24.5 20, 39.5 20, 43.7 17.6 L 44 19 C 40 21.5, 24 21.5, 20 19 Z" fill="#8E2B22" stroke="none"/>
          </g>

        </svg>
        <p id="boot-title"><span>NAKAMA BROS</span></p>
        <div id="boot-keel">
          <i></i>
          <svg viewBox="0 0 24 8" aria-hidden="true"><path d="M12 0 L 17 4 L 12 8 L 7 4 Z" fill="#F1D386"/></svg>
          <i></i>
        </div>
      </div>
    </div>
