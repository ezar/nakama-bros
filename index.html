    <style>
      /* Boot card — see the #boot markup at the end of <body>.
         Inlined on purpose: this has to paint on the very first frame, before
         the stylesheet or the bundle has been fetched. The palette and the
         horizon at 62% match the generated launch images so iOS hands off
         without a cut, and the wordmark is treated like the title screen's. */
      html, body { margin: 0; background: #050a14; }
      #boot {
        --mark: min(30vmin, 200px);
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: linear-gradient(180deg, #04070f 0%, #0a1930 45%, #22405c 85%, #3d5b6e 100%);
        opacity: 1;
        transition: opacity 420ms ease-out;
      }
      #boot.boot--gone { opacity: 0; pointer-events: none; }
      /* The sun still burning just under the horizon. A flat band rather than
         a radial bloom, because that is what the launch images can afford: a
         gradient that varies in two directions makes every pixel of a 2732px
         PNG unique, and the file quadruples. */
      #boot::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 28%;
        height: 34%;
        background: linear-gradient(to top,
          rgba(255, 224, 160, 0.8) 0%, rgba(232, 131, 74, 0.34) 22%, rgba(10, 25, 48, 0) 100%);
      }
      #boot::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.34) 100%);
      }
      #boot-sea {
        position: absolute;
        left: 0;
        right: 0;
        top: 62%;
        bottom: 0;
        background: linear-gradient(180deg, #255c74 0%, #0a2438 30%, #050a14 100%);
      }
      #boot-stars {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 62%;
      }
      /* drawn before the sea so the waterline cuts the hull off cleanly */
      #boot-ship {
        position: absolute;
        left: 78%;
        top: 62%;
        height: calc(var(--mark) * 0.24);
        width: calc(var(--mark) * 0.24 * 64 / 45);
        transform: translate(-50%, -100%);
      }
      /* the sun's path on the water: a soft corridor, blurred so it reads as
         light rather than as a jetty laid across the bay */
      #boot-path {
        position: absolute;
        left: 0;
        right: 0;
        top: 62%;
        bottom: 0;
        /* `filter` is applied before `clip-path`, so a single element clipped
           and blurred still comes out with knife edges. Blur the wrapper and
           clip the child inside it. */
        filter: blur(1.4vmin);
      }
      #boot-path i {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
          rgba(255, 223, 164, 0.3) 0%, rgba(255, 223, 164, 0.1) 45%, rgba(255, 223, 164, 0) 100%);
        clip-path: polygon(calc(50% - 1.6vmin) 0, calc(50% + 1.6vmin) 0, 72% 100%, 28% 100%);
      }
      #boot-stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 62%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* pulled up so the mark stands on the horizon rather than in the sky */
      #boot-mark { width: var(--mark); height: var(--mark); margin-top: calc(var(--mark) * -0.92); }
      #boot-title {
        position: relative;
        display: inline-block;
        margin: calc(var(--mark) * 0.12) 0 0;
        font-family: 'Rubik', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        font-size: calc(var(--mark) * 0.28);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.012em;
      }
      /* Back layer: ink contour plus an extrusion falling away from the light.
         A text-shadow cannot sit behind a background-clipped fill, so the two
         are separate boxes stacked in place — the same trick the logo uses. */
      #boot-title::before {
        content: 'NAKAMA BROS';
        position: absolute;
        left: 0;
        top: 0;
        color: #23130a;
        -webkit-text-stroke: 0.055em #23130a;
        text-shadow: 0 0.028em 0 #3b2410, 0 0.05em 0 #2a1808, 0 0.075em 0 #1b0f07,
                     0 0.1em 0 #140a04, 0 0.17em 0.22em rgba(0, 0, 0, 0.8);
      }
      #boot-title span {
        position: relative;
        background: linear-gradient(180deg, #fff3ce 0%, #f4c542 40%, #c8973f 56%, #8a5f1e 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot-keel {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(var(--mark) * 0.04);
        width: calc(var(--mark) * 1.5);
        margin-top: calc(var(--mark) * 0.11);
      }
      #boot-keel i { flex: 1; height: 1px; }
      #boot-keel i:first-of-type { background: linear-gradient(90deg, transparent, #c8973f); }
      #boot-keel i:last-of-type { background: linear-gradient(90deg, #c8973f, transparent); }
      #boot-keel svg { width: calc(var(--mark) * 0.11); height: calc(var(--mark) * 0.037); }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: none; }
      }
